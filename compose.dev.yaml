# ローカル開発用（WSL 内で実行する）。VPS 用は compose.yaml。
# WSL に Node / pnpm を入れなくても、依存インストール・開発サーバー・テストがコンテナ内で動く。
#
#   起動     docker compose -f compose.dev.yaml up -d        → http://localhost:3000
#   ログ     docker compose -f compose.dev.yaml logs -f web
#   テスト   docker compose -f compose.dev.yaml run --rm web pnpm test
#   lint     docker compose -f compose.dev.yaml run --rm web pnpm --filter web lint
#   停止     docker compose -f compose.dev.yaml down
#
# DB を使う段階（手順書 Step 5 以降）は --profile db を付ける:
#   docker compose -f compose.dev.yaml --profile db up -d
#   docker compose -f compose.dev.yaml --profile db run --rm web pnpm db:migrate
#   docker compose -f compose.dev.yaml --profile db exec db psql -U picross
name: picross-dev

services:
  web:
    build:
      dockerfile_inline: |
        FROM node:22-bookworm-slim
        RUN npm i -g pnpm@10.28.0 && mkdir -p /pnpm/store && chown node:node /pnpm/store
    # node ユーザー = uid 1000。WSL のユーザーと同じなので、作られる node_modules などの所有者がずれない
    user: node
    init: true
    working_dir: /repo
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev"
    environment:
      # pnpm のストアをボリュームに置く（未指定だと /repo/.pnpm-store がプロジェクト内にできる）
      npm_config_store_dir: /pnpm/store
      NEXT_TELEMETRY_DISABLED: "1"
      # 署名鍵などは apps/web/.env.local から読む。DB の接続先だけここで指定
      DATABASE_URL: postgres://picross:picross@db:5432/picross
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/repo
      - pnpm-store:/pnpm/store

  db:
    image: postgres:17
    profiles: [db]
    environment:
      POSTGRES_USER: picross
      POSTGRES_PASSWORD: picross
      POSTGRES_DB: picross
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pnpm-store:
  pgdata:
